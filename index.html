<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real o AI?</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #020d1c;
    --navy:      #05193a;
    --blue:      #0d3068;
    --blue-mid:  #1a5bbf;
    --gold:      #f0c040;
    --orange:    #e08820;
    --white:     #ffffff;
    --dim:       rgba(255,255,255,0.45);
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 50%, #061d3a 0%, #020d1c 70%);
    color: var(--white);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  /* ─── SCREENS ─────────────────────────────────────────── */
  .screen { display: none; width: 100%; max-width: 960px; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }

  /* ─── INTRO ───────────────────────────────────────────── */
  #screen-intro {
    gap: 48px;
    text-align: center;
    animation: fadeIn .5s ease;
  }

  .intro-eyebrow {
    font-size: 0.65rem;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold);
  }

  .intro-title {
    font-size: clamp(3rem, 10vw, 6rem);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
    /* WWTBAM gold-to-white gradient on text */
    background: linear-gradient(160deg, #ffffff 30%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .intro-sub {
    font-size: 1rem;
    color: var(--dim);
    letter-spacing: 0.5px;
  }

  /* ─── WWTBAM BUTTON ───────────────────────────────────── */
  .btn-wwtbam {
    position: relative;
    display: inline-block;
    background: linear-gradient(180deg, #1a4fa8 0%, #0a2c6d 100%);
    border: 2px solid #2a6dcc;
    color: var(--white);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 18px 56px;
    cursor: pointer;
    clip-path: polygon(16px 0%, calc(100% - 16px) 0%, 100% 50%, calc(100% - 16px) 100%, 16px 100%, 0% 50%);
    transition: filter .2s, transform .1s;
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
  }

  .btn-wwtbam::before {
    content: '';
    position: absolute;
    inset: 3px;
    clip-path: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,.08) 0%, transparent 60%);
    pointer-events: none;
  }

  .btn-wwtbam:hover {
    filter: brightness(1.25);
    transform: scale(1.02);
  }

  .btn-wwtbam:active { transform: scale(0.98); }

  /* ─── GAME ────────────────────────────────────────────── */
  #screen-game { gap: 28px; }

  /* Progress */
  .top-bar {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }

  .round-counter {
    font-size: 0.65rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
  }

  .progress-track {
    width: 100%;
    max-width: 600px;
    height: 2px;
    background: rgba(255,255,255,.1);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue-mid), var(--gold));
    transition: width .6s ease;
  }

  /* Images grid */
  .images-grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* WWTBAM answer card */
  .img-card {
    position: relative;
    cursor: pointer;
    overflow: hidden;
    aspect-ratio: 4/3;
    background: var(--blue);
    /* WWTBAM hex-ish clipping — subtle angled corners */
    clip-path: polygon(0 0, calc(100% - 0px) 0, 100% 0, 100% 100%, 0 100%);
    border: 2px solid #1a4b9c;
    transition: border-color .15s, filter .15s;
  }

  .img-card::after {
    /* inner shine line */
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 40%;
    background: linear-gradient(180deg, rgba(255,255,255,.07) 0%, transparent 100%);
    pointer-events: none;
  }

  .img-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: filter .3s;
  }

  /* Label A / B — WWTBAM style pill */
  .card-label {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: linear-gradient(180deg, #1a4fa8 0%, #0a2c6d 100%);
    border: 1.5px solid #2a6dcc;
    color: var(--gold);
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 2px;
    padding: 4px 12px;
    clip-path: polygon(6px 0%, calc(100% - 6px) 0%, 100% 50%, calc(100% - 6px) 100%, 6px 100%, 0% 50%);
    pointer-events: none;
  }

  /* Hover state */
  .img-card:not(.locked):hover {
    border-color: var(--gold);
    filter: brightness(1.08);
  }

  /* Selected / locked — WWTBAM orange lock-in */
  .img-card.selected {
    border-color: var(--orange);
    box-shadow: 0 0 0 4px rgba(224,136,32,.25), inset 0 0 40px rgba(224,136,32,.15);
  }

  .img-card.selected img { filter: brightness(.85); }

  /* Loader */
  .img-loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--navy);
    font-size: 0.6rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* ─── END ─────────────────────────────────────────────── */
  #screen-end {
    gap: 36px;
    text-align: center;
    animation: fadeIn .6s ease;
  }

  .end-score {
    font-size: clamp(5rem, 18vw, 9rem);
    font-weight: 800;
    letter-spacing: -4px;
    line-height: 1;
    background: linear-gradient(160deg, #ffffff 20%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .end-score sup {
    font-size: .35em;
    letter-spacing: -1px;
    -webkit-text-fill-color: rgba(255,255,255,.3);
  }

  .end-message {
    font-size: clamp(.95rem, 2.5vw, 1.25rem);
    color: var(--dim);
    max-width: 480px;
    line-height: 1.65;
    letter-spacing: .2px;
  }

  /* ─── ANIMATIONS ──────────────────────────────────────── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── MOBILE ──────────────────────────────────────────── */
  @media (max-width: 580px) {
    .images-grid { grid-template-columns: 1fr; }
    .img-card { aspect-ratio: 16/10; }
    .intro-title { letter-spacing: -1px; }
  }
</style>
</head>
<body>

<!-- INTRO -->
<div id="screen-intro" class="screen active">
  <p class="intro-eyebrow">Architettura di Interni</p>
  <h1 class="intro-title">Real o AI?</h1>
  <p class="intro-sub">Quale delle due è una fotografia?</p>
  <button class="btn-wwtbam" onclick="startGame()">Inizia</button>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <div class="top-bar">
    <span class="round-counter" id="round-counter">1 / 6</span>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="images-grid" id="images-grid">
    <div class="img-card" id="card-left" onclick="choose('left')">
      <div class="img-loader" id="loader-left">·</div>
      <img id="img-left" src="" alt="" style="display:none" onload="onImgLoad('left')">
      <div class="card-label">A</div>
    </div>
    <div class="img-card" id="card-right" onclick="choose('right')">
      <div class="img-loader" id="loader-right">·</div>
      <img id="img-right" src="" alt="" style="display:none" onload="onImgLoad('right')">
      <div class="card-label">B</div>
    </div>
  </div>
</div>

<!-- END -->
<div id="screen-end" class="screen">
  <div class="end-score" id="end-score">0<sup>/6</sup></div>
  <p class="end-message">non importa quale immagine sia stata generata con AI,<br>importa che ci hai dovuto pensare.</p>
  <button class="btn-wwtbam" onclick="startGame()">Rigioca</button>
</div>

<script>
const ROUNDS = [
  {
    ai:   'images/04_simmetrica.png',
    real: 'https://images.unsplash.com/photo-1757605327126-9baefea3348b?w=900&q=85&fit=crop'
  },
  {
    ai:   'images/05_angolo-architettonico.png',
    real: 'https://images.unsplash.com/photo-1750639258774-9a714379a093?w=900&q=85&fit=crop'
  },
  {
    ai:   'images/06_attraverso-soglia.png',
    real: 'https://images.unsplash.com/photo-1724765440530-e3954ac2e61d?w=900&q=85&fit=crop'
  },
  {
    ai:   'images/07_high-angle.png',
    real: 'https://images.unsplash.com/photo-1727399535326-65e21b522ccb?w=900&q=85&fit=crop'
  },
  {
    ai:   'images/09_dettaglio-architettonico.png',
    real: 'https://images.unsplash.com/photo-1684846416931-dddf8cbfc2ad?w=900&q=85&fit=crop'
  },
  {
    ai:   'images/10_macro-materiale.png',
    real: 'https://images.unsplash.com/photo-1637822412454-085098b4c8c0?w=900&q=85&fit=crop'
  }
];

const state = { round: 0, score: 0, order: [], realSide: null, locked: false };

function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame() {
  state.round = 0;
  state.score = 0;
  state.locked = false;
  state.order = shuffle([0,1,2,3,4,5]);
  show('screen-game');
  loadRound();
}

function loadRound() {
  state.locked = false;
  const data = ROUNDS[state.order[state.round]];
  const n = state.round + 1;
  const total = ROUNDS.length;

  document.getElementById('round-counter').textContent = `${n} / ${total}`;
  document.getElementById('progress-fill').style.width = `${((n - 1) / total) * 100}%`;

  state.realSide = Math.random() < .5 ? 'left' : 'right';
  const aiSide = state.realSide === 'left' ? 'right' : 'left';

  ['left', 'right'].forEach(side => {
    const card = document.getElementById('card-' + side);
    const img  = document.getElementById('img-' + side);
    const ldr  = document.getElementById('loader-' + side);
    card.className = 'img-card';
    card.onclick = () => choose(side);
    img.style.display = 'none';
    ldr.style.display = 'flex';
  });

  document.getElementById('img-' + state.realSide).src = data.real;
  document.getElementById('img-' + aiSide).src = data.ai;
}

function onImgLoad(side) {
  document.getElementById('img-' + side).style.display = 'block';
  document.getElementById('loader-' + side).style.display = 'none';
}

function choose(side) {
  if (state.locked) return;
  state.locked = true;

  if (side === state.realSide) state.score++;

  // Lock both cards
  ['left','right'].forEach(s => {
    document.getElementById('card-' + s).onclick = null;
    document.getElementById('card-' + s).classList.add('locked');
  });

  // Highlight selected — WWTBAM lock-in style
  document.getElementById('card-' + side).classList.add('selected');

  // Auto-advance
  setTimeout(() => {
    state.round++;
    if (state.round >= ROUNDS.length) {
      document.getElementById('progress-fill').style.width = '100%';
      document.getElementById('end-score').innerHTML = `${state.score}<sup>/${ROUNDS.length}</sup>`;
      show('screen-end');
    } else {
      loadRound();
    }
  }, 1400);
}
</script>
</body>
</html>
