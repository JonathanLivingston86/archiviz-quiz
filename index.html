<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real o AI?</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #020d1c;
    --navy:     #05193a;
    --blue:     #0d3068;
    --blue-hi:  #1a5bbf;
    --gold:     #f0c040;
    --orange:   #e08820;
    --white:    #ffffff;
    --dim:      rgba(255,255,255,.45);
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  /* ─── SCREENS ─────────────────────────────── */
  .screen { display: none; position: fixed; inset: 0; }
  .screen.active { display: flex; }

  /* ─── INTRO ───────────────────────────────── */
  #screen-intro {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    text-align: center;
    padding: 32px;
    background: var(--bg);
    background-image: radial-gradient(ellipse 90% 70% at 50% 50%, #071e3d 0%, #020d1c 70%);
    animation: fadeUp .5s ease;
  }

  .intro-eyebrow {
    font-size: 0.6rem;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold);
  }

  .intro-title {
    font-size: clamp(3.5rem, 12vw, 7rem);
    font-weight: 800;
    letter-spacing: -3px;
    line-height: .95;
    background: linear-gradient(150deg, #fff 20%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .intro-sub {
    font-size: clamp(.85rem, 2vw, 1rem);
    color: var(--dim);
  }

  /* hexagonal button */
  .btn-hex {
    position: relative;
    background: linear-gradient(180deg, #1a4fa8 0%, #0a2c6d 100%);
    border: 2px solid #2a6dcc;
    color: var(--white);
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 17px 56px;
    cursor: pointer;
    clip-path: polygon(18px 0%, calc(100% - 18px) 0%, 100% 50%, calc(100% - 18px) 100%, 18px 100%, 0% 50%);
    transition: filter .2s, transform .1s;
  }
  .btn-hex::before {
    content: '';
    position: absolute;
    inset: 3px;
    clip-path: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,.1) 0%, transparent 60%);
    pointer-events: none;
  }
  .btn-hex:hover { filter: brightness(1.3); transform: scale(1.03); }
  .btn-hex:active { transform: scale(.97); }

  /* ─── GAME ────────────────────────────────── */
  #screen-game {
    flex-direction: column;
  }

  /* Slim overlay bar at top */
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 14px 20px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    /* fade-to-transparent gradient so images show below */
    background: linear-gradient(to bottom, rgba(2,13,28,.85) 0%, transparent 100%);
    padding-bottom: 24px;
  }

  .round-lbl {
    font-size: .6rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
  }

  .prog-track {
    width: min(500px, 60vw);
    height: 2px;
    background: rgba(255,255,255,.12);
  }
  .prog-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue-hi), var(--gold));
    transition: width .55s ease;
  }

  /* Images — fill viewport */
  .images-row {
    display: flex;
    flex: 1;
    width: 100%;
    height: 100%;
  }

  .img-card {
    position: relative;
    flex: 1;
    cursor: pointer;
    overflow: hidden;
    border: 0;
    transition: filter .15s;
  }

  /* Thin separator between A and B */
  .img-card:first-child { border-right: 2px solid rgba(26,91,191,.6); }

  .img-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: filter .3s;
  }

  /* Bottom gradient + label */
  .img-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 35%;
    background: linear-gradient(to top, rgba(2,13,28,.75) 0%, transparent 100%);
    pointer-events: none;
  }

  .card-lbl {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    background: linear-gradient(180deg, #1a4fa8 0%, #0a2c6d 100%);
    border: 1.5px solid #2a6dcc;
    color: var(--gold);
    font-size: .65rem;
    font-weight: 800;
    letter-spacing: 2px;
    padding: 5px 16px;
    clip-path: polygon(8px 0%, calc(100% - 8px) 0%, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0% 50%);
    pointer-events: none;
  }

  /* hover */
  .img-card:not(.locked):hover img { filter: brightness(1.1); }
  .img-card:not(.locked):hover .card-lbl {
    background: linear-gradient(180deg, #2a6fe0 0%, #1040a0 100%);
    border-color: var(--gold);
  }

  /* selected — orange lock-in glow */
  .img-card.selected img { filter: brightness(.75); }
  .img-card.selected::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 3;
    background: rgba(224,136,32,.18);
    box-shadow: inset 0 0 0 4px var(--orange);
    pointer-events: none;
  }
  .img-card.selected .card-lbl {
    background: linear-gradient(180deg, var(--orange) 0%, #a05010 100%);
    border-color: var(--gold);
  }

  /* Loader */
  .img-loader {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--navy);
    color: var(--dim);
    font-size: .6rem;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Mobile: stack vertically */
  @media (max-width: 640px) {
    .images-row { flex-direction: column; }
    .img-card:first-child { border-right: 0; border-bottom: 2px solid rgba(26,91,191,.6); }
    .prog-track { width: 70vw; }
  }

  /* ─── END ─────────────────────────────────── */
  #screen-end {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    text-align: center;
    padding: 40px 28px;
    background: var(--bg);
    background-image: radial-gradient(ellipse 80% 60% at 50% 50%, #071e3d 0%, #020d1c 70%);
    animation: fadeUp .5s ease;
    overflow-y: auto;
  }

  .end-eyebrow {
    font-size: .6rem;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 20px;
  }

  .end-score {
    font-size: clamp(5rem, 20vw, 10rem);
    font-weight: 800;
    letter-spacing: -5px;
    line-height: 1;
    background: linear-gradient(150deg, #fff 10%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }

  .end-score-denom {
    font-size: .28em;
    letter-spacing: -1px;
    -webkit-text-fill-color: rgba(255,255,255,.25);
  }

  .end-divider {
    width: 48px;
    height: 2px;
    background: var(--gold);
    margin: 28px auto;
    opacity: .6;
  }

  .end-headline {
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.2;
    max-width: 560px;
    margin: 0 auto;
    /* gold highlight on key phrase */
  }

  .end-headline em {
    font-style: normal;
    color: var(--gold);
  }

  .end-tagline {
    font-size: clamp(.8rem, 1.8vw, .95rem);
    color: var(--dim);
    margin-top: 14px;
    letter-spacing: .5px;
    max-width: 400px;
  }

  .end-replay {
    margin-top: 48px;
  }

  /* ─── ANIMATIONS ──────────────────────────── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- INTRO -->
<div id="screen-intro" class="screen active">
  <p class="intro-eyebrow">Architettura di Interni</p>
  <h1 class="intro-title">Real o AI?</h1>
  <p class="intro-sub">Quale delle due è una fotografia?</p>
  <button class="btn-hex" onclick="startGame()">Inizia</button>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <div class="hud">
    <span class="round-lbl" id="round-lbl">1 / 6</span>
    <div class="prog-track">
      <div class="prog-fill" id="prog-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="images-row" id="images-row">
    <div class="img-card" id="card-left" onclick="choose('left')">
      <div class="img-loader" id="ldr-left">·</div>
      <img id="img-left" src="" alt="" style="display:none" onload="imgReady('left')">
      <div class="card-lbl">A</div>
    </div>
    <div class="img-card" id="card-right" onclick="choose('right')">
      <div class="img-loader" id="ldr-right">·</div>
      <img id="img-right" src="" alt="" style="display:none" onload="imgReady('right')">
      <div class="card-lbl">B</div>
    </div>
  </div>
</div>

<!-- END -->
<div id="screen-end" class="screen">
  <p class="end-eyebrow">Fine gioco</p>

  <div class="end-score" id="end-score">
    0<span class="end-score-denom">/6</span>
  </div>

  <div class="end-divider"></div>

  <h2 class="end-headline">
    Non importa quale immagine<br>
    sia stata <em>generata dall'AI</em>.<br>
    Importa che ci hai dovuto pensare.
  </h2>
  <p class="end-tagline">Il confine è già scomparso. Questa era solo pratica.</p>

  <div class="end-replay">
    <button class="btn-hex" onclick="startGame()">Rigioca</button>
  </div>
</div>

<script>
const ROUNDS = [
  { ai: 'images/04_simmetrica.png',          real: 'https://images.unsplash.com/photo-1757605327126-9baefea3348b?w=1200&q=85&fit=crop&crop=center' },
  { ai: 'images/05_angolo-architettonico.png', real: 'https://images.unsplash.com/photo-1750639258774-9a714379a093?w=1200&q=85&fit=crop&crop=center' },
  { ai: 'images/06_attraverso-soglia.png',    real: 'https://images.unsplash.com/photo-1724765440530-e3954ac2e61d?w=1200&q=85&fit=crop&crop=center' },
  { ai: 'images/07_high-angle.png',           real: 'https://images.unsplash.com/photo-1727399535326-65e21b522ccb?w=1200&q=85&fit=crop&crop=center' },
  { ai: 'images/09_dettaglio-architettonico.png', real: 'https://images.unsplash.com/photo-1684846416931-dddf8cbfc2ad?w=1200&q=85&fit=crop&crop=center' },
  { ai: 'images/10_macro-materiale.png',      real: 'https://images.unsplash.com/photo-1637822412454-085098b4c8c0?w=1200&q=85&fit=crop&crop=center' }
];

const st = { round: 0, score: 0, order: [], realSide: null, locked: false };

const shuffle = a => {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
};

const show = id => {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
};

function startGame() {
  st.round = 0; st.score = 0; st.locked = false;
  st.order = shuffle([0,1,2,3,4,5]);
  show('screen-game');
  loadRound();
}

function loadRound() {
  st.locked = false;
  const data = ROUNDS[st.order[st.round]];
  const n = st.round + 1, tot = ROUNDS.length;

  document.getElementById('round-lbl').textContent = `${n} / ${tot}`;
  document.getElementById('prog-fill').style.width = `${((n - 1) / tot) * 100}%`;

  st.realSide = Math.random() < .5 ? 'left' : 'right';
  const aiSide = st.realSide === 'left' ? 'right' : 'left';

  ['left','right'].forEach(s => {
    const card = document.getElementById('card-' + s);
    const img  = document.getElementById('img-' + s);
    const ldr  = document.getElementById('ldr-' + s);
    card.className = 'img-card';
    card.onclick = () => choose(s);
    img.style.display = 'none';
    ldr.style.display = 'flex';
  });

  document.getElementById('img-' + st.realSide).src = data.real;
  document.getElementById('img-' + aiSide).src      = data.ai;
}

function imgReady(side) {
  document.getElementById('img-' + side).style.display = 'block';
  document.getElementById('ldr-' + side).style.display = 'none';
}

function choose(side) {
  if (st.locked) return;
  st.locked = true;
  if (side === st.realSide) st.score++;

  ['left','right'].forEach(s => {
    document.getElementById('card-' + s).onclick = null;
    document.getElementById('card-' + s).classList.add('locked');
  });
  document.getElementById('card-' + side).classList.add('selected');

  setTimeout(() => {
    st.round++;
    if (st.round >= ROUNDS.length) {
      document.getElementById('prog-fill').style.width = '100%';
      document.getElementById('end-score').innerHTML =
        `${st.score}<span class="end-score-denom">/${ROUNDS.length}</span>`;
      show('screen-end');
    } else {
      loadRound();
    }
  }, 1400);
}
</script>
</body>
</html>
